<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume of a Sphere</title>

  <style>
    body {
      font-family: "Times New Roman", serif;
      margin: 30px;
      background: white;
      color: black;
    }

    .container {
      width: 420px;
    }

    h3 {
      font-size: 20px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    label {
      display: block;
      font-size: 20px;
      margin-top: 8px;
    }

    input {
      width: 260px;
      height: 30px;
      font-size: 18px;
      padding: 2px 6px;
      border: 2px solid #999;
    }

    button {
      display: block;
      margin-top: 3px;
      padding: 3px 12px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">
    <h3>Input radius value and get the volume of a sphere.</h3>

    <form onsubmit="volume_sphere(); return false;">

      <label for="radius">Radius</label>
      <input type="text" id="radius">

      <label for="volume">Volume</label>
      <input type="text" id="volume" readonly>

      <button type="submit">Calculate</button>

    </form>
  </div>

  <script>
    function volume_sphere() {
      const radius = parseFloat(document.getElementById("radius").value);

      let volume;

      if (isNaN(radius) || radius < 0) {
        volume = NaN;
      } else {
        volume = (4 / 3) * Math.PI * Math.pow(radius, 3);
        volume = volume.toFixed(4);
      }

      document.getElementById("volume").value = volume;
    }
  </script>

</body>
</html>
